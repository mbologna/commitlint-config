name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  # A manual run on main releases whatever is unreleased; auto-release also
  # dispatches this workflow on the tag it creates.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  node:
    uses: mbologna/.github/.github/workflows/node-ci.yml@d17b76ff2f8404153bf1fa08e875e6972b046c09 # main
    with:
      node_version: "26"
      enable_audit: true

  docker:
    needs: node
    # Build, push, sign and scan the image; the auto-release job below releases.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: mbologna/.github/.github/workflows/docker-ci.yml@d17b76ff2f8404153bf1fa08e875e6972b046c09 # main
    with:
      image_name: commitlint-config
      # Only release tags publish the image (auto-release dispatches their
      # build); pull requests build it without pushing.
      publish: release
      # commitlint-range runs git log on the job's checkout.
      allowed_tools: git
      smoke_cmd: "commitlint-range --version"
    secrets: inherit

  # Monday's schedule tags vX.Y.Z when a feat, fix, perf, revert or breaking commit
  # landed (or a maintenance release for dependency updates), a push to main tags
  # only a CVE fix; it dispatches the tag build that publishes the X.Y.Z image.
  auto-release:
    needs: [node, docker]
    # contents: push the tag and create the Release; actions: dispatch the tag
    # build (a tag pushed with GITHUB_TOKEN triggers no run).
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@d17b76ff2f8404153bf1fa08e875e6972b046c09 # main
    with:
      strategy: conventional
      image: ghcr.io/mbologna/commitlint-config
      dockerfiles: Dockerfile

  publish:
    # The npm package, from the same release tag as the image. npm's trusted
    # publisher for commitlint-config-mbologna names this workflow (ci.yml).
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: mbologna/.github/.github/workflows/npm-publish.yml@d17b76ff2f8404153bf1fa08e875e6972b046c09 # main
    with:
      node_version: "26"
